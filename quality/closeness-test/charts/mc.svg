<svg xmlns="http://www.w3.org/2000/svg" width="640" height="226" viewBox="0 0 640 226" role="img" aria-labelledby="t d"><title id="t">Multiple-choice accuracy by build</title><desc id="d">Accuracy of the NVFP4 reference, hot_iq and Volta sPLIt on the same multiple-choice items with bootstrap 95% intervals. The same figures are in the table beside this chart.</desc><rect width="640" height="226" fill="#fcfcfb"/><text x="16.00" y="24.00" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="600" style="font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Multiple-choice accuracy, thinking off, temperature 0</text><text x="16.00" y="42.00" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Dots are accuracy, bars are 95% intervals. The axis does not start at zero.</text><line x1="150.00" x2="150.00" y1="50" y2="176" stroke="#e4e3de" stroke-width="1"/><text x="150.00" y="194.00" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" style="font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">75%</text><line x1="255.00" x2="255.00" y1="50" y2="176" stroke="#e4e3de" stroke-width="1"/><text x="255.00" y="194.00" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" style="font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">80%</text><line x1="360.00" x2="360.00" y1="50" y2="176" stroke="#e4e3de" stroke-width="1"/><text x="360.00" y="194.00" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" style="font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">85%</text><line x1="465.00" x2="465.00" y1="50" y2="176" stroke="#e4e3de" stroke-width="1"/><text x="465.00" y="194.00" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" style="font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">90%</text><line x1="570.00" x2="570.00" y1="50" y2="176" stroke